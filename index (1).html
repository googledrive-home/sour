<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A simple personal website.">
  <title>My Website</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #172033;
      background: linear-gradient(135deg, #eef4ff, #f8f5ff);
    }
    main {
      width: min(100%, 720px);
      padding: clamp(28px, 6vw, 56px);
      text-align: center;
      background: rgba(255, 255, 255, 0.92);
      border: 1px solid #e5e9f2;
      border-radius: 24px;
      box-shadow: 0 18px 55px rgba(31, 48, 82, 0.10);
    }
    .tag {
      display: inline-block;
      margin-bottom: 18px;
      padding: 7px 13px;
      border-radius: 999px;
      background: #edf2ff;
      color: #4258a5;
      font-size: 0.85rem;
      font-weight: 650;
      letter-spacing: 0.02em;
    }
    h1 {
      margin: 0;
      font-size: clamp(2.3rem, 8vw, 4.2rem);
      line-height: 1.05;
      letter-spacing: -0.045em;
    }
    p {
      max-width: 510px;
      margin: 20px auto 0;
      color: #5b6475;
      font-size: clamp(1rem, 2.5vw, 1.15rem);
      line-height: 1.7;
    }
    footer {
      margin-top: 42px;
      color: #8a91a0;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <main>
    <span class="tag">MY WEBSITE</span>
    <h1>Welcome!</h1>
    <p>This is my new website. I’m just getting started, so check back soon to see what I add here.</p>
    <footer>Made with care · Thanks for visiting</footer>
  </main>
</body>
</html>
